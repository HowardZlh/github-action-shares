# Copy to <your-login>/<your-login>/.github/workflows/profile-showcase.yml
# (the special repo whose README shows on your profile page).
#
# Job art     -> snake (Platane/snk), 3D contrib (yoshi389111), heatmap + skyline
#                (this repo) on the `output` branch.
# Job readme  -> rewrites the SHOWCASE:REPOS and SHOWCASE:ACTIVITY blocks in README.md.
# Job metrics -> lowlighter/metrics languages card; needs secret METRICS_TOKEN, skipped without it.
name: Profile showcase

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["metrics/**"]

permissions:
  contents: write

concurrency:
  group: profile-showcase
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: mkdir -p dist/3d && cp profile-3d-contrib/*.svg dist/3d/
      - name: Heatmap + skyline
        uses: HowardZlh/github-action-shares@v1
        with:
          source: user
          target: ${{ github.repository_owner }}
          label: contributions
          out-dir: dist/art
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: refresh profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: HowardZlh/github-action-shares@v1
        with:
          command: readme
          # replace with your own projects; they are sorted by stars
          repos: HowardZlh/stellar-odyssey,HowardZlh/usage-guard-collector,FailRouter/failrouter,HowardZlh/github-action-shares
          activity: users:${{ github.repository_owner }}
          skip-repos: ${{ github.repository }}
          limit: 6
      - name: Commit if anything changed
        run: |
          git diff --quiet && { echo "README unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh README stars and activity"
          git push

  metrics:
    needs: readme # commit after the README job so the two never race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::METRICS_TOKEN not set, metrics card skipped"
      - if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: refresh metrics card"
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai
          config_display: large
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, shell, dockerfile
          # plugin_achievements is off: in v3.34 it still queries classic Projects,
          # which GitHub removed, and the card shows "Unexpected error"
