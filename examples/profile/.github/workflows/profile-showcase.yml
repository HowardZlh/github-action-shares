# Copy to <your-login>/<your-login>/.github/workflows/profile-showcase.yml
# (the special repo whose README shows on your profile page).
#
# Job art     -> 3D contrib (yoshi389111), plus snake / heatmap / skyline / stats.json from
#                this action, on the `output` branch. The README uses the snake, the 3D
#                chart and three shields badges that read stats.json.
# Job readme  -> rewrites the SHOWCASE:REPOS and SHOWCASE:ACTIVITY blocks in README.md.
#
# Left out on purpose:
#   Platane/snk        eats colour layer by colour layer, not the nearest square: a dense
#                      year loops for ~85 s and the darkest days come last.
#   heatmap / skyline  the same numbers as the snake and the 3D chart, and GitHub already
#                      draws the heatmap under a profile README.
#   lowlighter/metrics its counts are public-only (e.g. "219 commits", "0 followers") and
#                      contradict a calendar that includes private contributions; the 3D
#                      chart already has a language donut.
name: Profile showcase

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-showcase
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: mkdir -p dist/3d && cp profile-3d-contrib/*.svg dist/3d/
      - name: Snake, heatmap, skyline and stats.json (README badges read stats.json)
        uses: HowardZlh/github-action-shares@v1
        with:
          source: user
          target: ${{ github.repository_owner }}
          label: contributions
          out-dir: dist/art
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: refresh profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: HowardZlh/github-action-shares@v1
        with:
          command: readme
          # replace with your own projects; they are sorted by stars
          repos: HowardZlh/stellar-odyssey,HowardZlh/usage-guard-collector,FailRouter/failrouter,HowardZlh/github-action-shares
          activity: users:${{ github.repository_owner }}
          skip-repos: ${{ github.repository }}
          limit: 6
      - name: Commit if anything changed
        run: |
          git diff --quiet && { echo "README unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh README stars and activity"
          git push
